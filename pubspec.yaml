name: pg_prep_mobile
description: Entrenamiento cognitivo con retos de memoria, lógica espacial y cálculo.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  remove_alpha_ios: true
  background_color_ios: '#91C4CF'
  web:
    generate: true
    image_path: assets/icon.png
    background_color: '#F5F7F7'
    theme_color: '#173F49'

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
    - assets/icon.png
  fonts:
    - family: FiraSans
      fonts:
        - asset: assets/fonts/FiraSans-Regular.otf
        - asset: assets/fonts/FiraSans-Medium.otf
          weight: 500
        - asset: assets/fonts/FiraSans-SemiBold.otf
          weight: 600
        - asset: assets/fonts/FiraSans-Bold.otf
          weight: 700
